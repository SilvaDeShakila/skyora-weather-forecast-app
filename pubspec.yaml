name: weather_forecast_app
description: "Weatherly - Weather Forecast App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/skyora_logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/skyora_logo.png"
  adaptive_icon_background: "#07111F"
  adaptive_icon_foreground: "assets/skyora_logo.png"
